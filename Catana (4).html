<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Stack — Red Neuronal</title>
<style>
  :root {
    --bg-0: #07090c;
    --bg-1: #11151b;
    --ink: #e8e4dc;
    --ink-dim: rgba(232,228,220,0.55);
    --accent: oklch(0.78 0.14 75);

    --blade-len: 460px;
    --blade-thick: 7px;
    --guard-w: 10px;
    --guard-h: 26px;
    --grip-len: 120px;
    --grip-thick: 14px;
    --steel-1: #f4f1ea;
    --steel-2: #cfcabd;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(120% 80% at 50% 50%, var(--bg-1) 0%, var(--bg-0) 70%);
    color: var(--ink);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    display: grid;
    place-items: center;
  }

  /* ── STAGE ── */
  .stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }

  /* ── HALO ── */
  .halo {
    position: absolute;
    top: 50%; left: 50%;
    width: 700px; height: 700px;
    margin: -350px 0 0 -350px;
    border-radius: 50%;
    background: radial-gradient(closest-side, rgba(232,228,220,0.12), transparent 70%);
    filter: blur(6px);
    opacity: 0;
    transition: opacity 1.2s ease;
    pointer-events: none;
  }

  /* ── KATANA ── */
  .katana-wrap {
    position: absolute;
    top: 50%; left: 50%;
    width: 0; height: 0;
    opacity: 0;
    filter: blur(6px);
    transform: translate(-40px, 8px) scale(0.98);
    transition: opacity 1.2s ease, filter 1.2s ease, transform 1.2s ease;
    will-change: transform, opacity, filter;
  }
  .katana { position: relative; transform: rotate(-30deg); width: 0; height: 0; }
  .blade {
    position: absolute; left: 0;
    top: calc(var(--blade-thick) / -2);
    width: var(--blade-len); height: var(--blade-thick);
    border-radius: 1px 2px 2px 1px;
    background: linear-gradient(180deg, var(--steel-2) 0%, var(--steel-1) 38%, #fff 50%, var(--steel-1) 62%, var(--steel-2) 100%);
    box-shadow: 0 0 0 1px rgba(0,0,0,0.35) inset;
  }
  .blade::after {
    content: "";
    position: absolute; right: -10px; top: 0;
    width: 14px; height: 100%;
    background: linear-gradient(180deg, var(--steel-2), var(--steel-1) 50%, var(--steel-2));
    clip-path: polygon(0 0, 100% 50%, 0 100%);
  }
  .blade::before {
    content: "";
    position: absolute; left: 4px; right: 12px; top: 55%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.55) 8%, rgba(255,255,255,0.55) 92%, transparent);
    filter: blur(0.4px); opacity: 0.7;
  }
  .habaki {
    position: absolute; left: -4px; top: -8px;
    width: 14px; height: 16px;
    background: linear-gradient(180deg, #d8d3c5, #f1ede2 50%, #b9b4a6);
    border-radius: 2px;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.4);
  }
  .tsuba {
    position: absolute;
    left: calc(-1 * var(--guard-w) - 4px);
    top: calc(var(--guard-h) / -2);
    width: var(--guard-w); height: var(--guard-h);
    background: linear-gradient(180deg, #1c1d20, #2a2b30 50%, #0f1013);
    border: 1px solid #000; border-radius: 2px;
  }
  .grip {
    position: absolute;
    left: calc(-1 * var(--guard-w) - 4px - var(--grip-len));
    top: calc(var(--grip-thick) / -2);
    width: var(--grip-len); height: var(--grip-thick);
    background:
      repeating-linear-gradient(45deg, transparent 0 8px, rgba(0,0,0,0.55) 8px 9px, transparent 9px 17px),
      repeating-linear-gradient(-45deg, transparent 0 8px, rgba(0,0,0,0.55) 8px 9px, transparent 9px 17px),
      linear-gradient(180deg, #2a2c31, #15171a 50%, #0a0b0d);
    border: 1px solid #000; border-radius: 3px;
  }
  .grip::after {
    content: "";
    position: absolute; left: 38%; top: 50%;
    width: 6px; height: 6px; margin: -3px 0 0 -3px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #c7a96a, #6e5320 70%, #2a1f08);
  }
  .kashira {
    position: absolute;
    left: calc(-1 * var(--guard-w) - 4px - var(--grip-len) - 8px);
    top: calc((var(--grip-thick) + 6px) / -2);
    width: 8px; height: calc(var(--grip-thick) + 6px);
    background: linear-gradient(180deg, #2a2b30, #0f1013);
    border: 1px solid #000; border-radius: 2px 1px 1px 2px;
  }

  /* ── CINTA ── */
  .ribbon {
    position: absolute; top: 50%; left: -5%;
    width: 110%; height: 3px; margin-top: -1.5px;
    transform-origin: left center; transform: scaleX(0);
    background: linear-gradient(90deg, transparent, rgba(255,240,210,0.9) 30%, #fff 50%, rgba(255,240,210,0.9) 70%, transparent);
    box-shadow: 0 0 14px rgba(255,235,190,0.65), 0 0 32px rgba(255,210,150,0.4);
    opacity: 0; pointer-events: none;
  }
  .ribbon.core {
    height: 1px; margin-top: -0.5px;
    background: linear-gradient(90deg, transparent, #fff 50%, transparent);
    box-shadow: 0 0 6px #fff, 0 0 18px rgba(255,255,255,0.6);
  }

  /* ── TÍTULO ── */
  .stack-title {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -70px);
    white-space: nowrap;
    font-size: clamp(22px, 3.5vw, 46px);
    font-weight: 300;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink);
    opacity: 0;
    pointer-events: none;
    border-bottom: 1px solid rgba(232,228,220,0.15);
    padding-bottom: 10px;
    transition: opacity 0.6s ease, filter 0.6s ease;
    filter: blur(4px);
  }
  .stack-title .pre { font-size: 0.5em; letter-spacing: 0.5em; color: var(--ink-dim); vertical-align: middle; }

  /* ── GRUPO (secuencial) ── */
  .group-panel {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    display: flex; flex-direction: column; align-items: center; gap: 18px;
    opacity: 0; pointer-events: none;
    transition: opacity 0.5s ease, filter 0.5s ease, transform 0.5s ease;
    filter: blur(4px);
    will-change: opacity, filter, transform;
  }
  .group-panel.visible {
    opacity: 1; filter: blur(0);
  }
  .group-panel .glabel {
    font-size: 11px; letter-spacing: 0.32em;
    text-transform: uppercase; color: var(--ink-dim);
  }
  .group-panel .row {
    display: flex; gap: 12px;
    align-items: center; flex-wrap: nowrap;
    justify-content: center;
  }

  /* ── CHIPS ── */
  .chip {
    display: inline-flex; align-items: center; gap: 9px;
    padding: 9px 14px 9px 10px;
    background: rgba(20,22,27,0.88);
    border: 1px solid rgba(232,228,220,0.12);
    border-radius: 999px; color: var(--ink);
    font-size: 14px; line-height: 1;
    backdrop-filter: blur(6px);
    box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset, 0 8px 24px rgba(0,0,0,0.45);
    cursor: default;
  }
  .chip .ico {
    width: 22px; height: 22px;
    display: grid; place-items: center;
    border-radius: 5px; flex: 0 0 22px;
    color: #0a0b0d; font-weight: 700; font-size: 11px;
    font-family: ui-monospace, Menlo, Consolas, monospace;
  }
  .chip .ico.ol { background: transparent; color: var(--ink); border: 1px solid currentColor; font-size: 10px; }
  .chip .ico svg { width: 13px; height: 13px; }
  .chip .name { letter-spacing: 0.02em; font-weight: 500; }

  /* ── RED NEURONAL ── */
  #neural-canvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    opacity: 0;
    transition: opacity 1.2s ease;
    pointer-events: none;
    z-index: 1;
  }
  .neural-nodes {
    position: absolute; inset: 0;
    opacity: 0;
    transition: opacity 1.2s ease;
    z-index: 2;
  }
  .node {
    position: absolute;
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 13px 8px 9px;
    background: rgba(20,22,27,0.95);
    border: 1px solid rgba(232,228,220,0.25);
    border-radius: 999px; color: var(--ink);
    font-size: 13px; line-height: 1;
    box-shadow:
      0 0 0 4px rgba(232,228,220,0.04),
      0 4px 24px rgba(0,0,0,0.6),
      inset 0 1px 0 rgba(255,255,255,0.06);
    transform: translate(-50%, -50%);
    white-space: nowrap;
    transition: box-shadow 0.4s ease;
  }
  .node:hover { box-shadow: 0 0 0 1px rgba(232,228,220,0.25), 0 4px 24px rgba(0,0,0,0.6); }
  .node .ico {
    width: 20px; height: 20px;
    display: grid; place-items: center;
    border-radius: 4px; flex: 0 0 20px;
    color: #0a0b0d; font-weight: 700; font-size: 10px;
    font-family: ui-monospace, Menlo, Consolas, monospace;
  }
  .node .ico.ol { background: transparent; color: var(--ink); border: 1px solid currentColor; font-size: 9px; }
  .node .ico svg { width: 12px; height: 12px; }
  .node .name { letter-spacing: 0.02em; font-weight: 500; font-size: 12px; }

  /* Contenedor de cluster: caja con título arriba y nodos contenidos */
  .cluster-box {
    position: absolute;
    border: 1px solid rgba(232,228,220,0.10);
    border-radius: 14px;
    background: rgba(255,255,255,0.015);
    overflow: hidden;
    opacity: 0;
    transition: opacity 1s ease;
  }
  .cluster-box .ctitle {
    position: absolute;
    top: 12px; left: 0; right: 0;
    text-align: center;
    font-size: 11px; letter-spacing: 0.32em;
    text-transform: uppercase;
    pointer-events: none;
    z-index: 3;
  }
  .cluster-box .cinner {
    position: absolute;
    inset: 38px 8px 8px 8px;  /* deja espacio para el título */
  }

  /* Label de categoría sobre cluster (legacy) */
  .cluster-label {
    position: absolute;
    font-size: 10px; letter-spacing: 0.3em;
    text-transform: uppercase; color: var(--ink-dim);
    transform: translate(-50%, -50%);
    pointer-events: none;
    white-space: nowrap;
  }

  /* Caption */
  .caption {
    position: fixed; left: 0; right: 0; bottom: 22px;
    text-align: center; font-size: 11px;
    letter-spacing: 0.32em; text-transform: uppercase;
    color: var(--ink-dim); pointer-events: none;
  }
  .caption b { color: var(--accent); font-weight: 500; }
</style>
</head>
<body>
<div class="stage" id="stage">

   HELPERS
═══════════════════════════════════════════════════ */
const wait   = ms => new Promise(r => setTimeout(r, ms));
const fadeIn = (el, dur = 600) => {
  el.style.transition = `opacity ${dur}ms ease, filter ${dur}ms ease, transform ${dur}ms ease`;
  el.style.opacity = '1';
  el.style.filter  = 'blur(0)';
  el.style.transform = el.style.transform.replace('translateY(10px)', 'translateY(0)');
};
const fadeOut = (el, dur = 200) => new Promise(r => {

  el.style.opacity = '0';

});

/* ═══════════════════════════════════════════════════
   KATANA — animación manual con rAF
═══════════════════════════════════════════════════ */
function animateKatana() {
  return new Promise(async resolve => {
    // Fase 1: aparecer suave
    halo.style.opacity = '1';
    katana.style.transition = 'opacity 1.4s ease, filter 1.4s ease, transform 1.4s ease';
    katana.style.opacity = '1';
    katana.style.filter  = 'blur(0)';
    katana.style.transform = 'translate(0, 0) scale(1)';

    await wait(1400);

    // Flotar
    katana.style.transition = 'transform 1.2s ease-in-out';
    katana.style.transform = 'translate(0, -6px) scale(1)';
    await wait(700);
    katana.style.transform = 'translate(0, 0) scale(1)';
    await wait(700);

    // Wind-up
    katana.style.transition = 'transform 0.35s ease-in';
    katana.style.transform = 'translate(-90px, 0) scale(1)';
    await wait(350);

    // ESTOCADA — animación rAF suave
    const startX = -90;
    const endX   = window.innerWidth + 200;
    const dur    = 420; // ms
    const t0     = performance.now();

    // Cinta aparece al mismo tiempo
    ribbon.style.transition  = 'none';
    ribbonC.style.transition = 'none';
    ribbon.style.opacity  = '0';
    ribbonC.style.opacity = '0';
    ribbon.style.transform  = 'scaleX(0)';
    ribbonC.style.transform = 'scaleX(0)';

    requestAnimationFrame(function tick(now) {
      const p = Math.min((now - t0) / dur, 1);
      const ease = p < 0.5 ? 2*p*p : -1+(4-2*p)*p; // ease-in-out
      const x = startX + (endX - startX) * ease;
      katana.style.transition = 'none';
      katana.style.transform  = `translate(${x}px, 0) rotate(${ease * 32}deg) scale(1.02)`;
      katana.style.filter     = p > 0.6 ? `blur(${(p-0.6)*6}px)` : 'blur(0)';
      katana.style.opacity    = p > 0.7 ? String(1 - (p-0.7)/0.3) : '1';

      // Cinta crece desde izquierda
      const rp = Math.min(p / 0.6, 1);
      ribbon.style.transform  = `scaleX(${rp})`;
      ribbonC.style.transform = `scaleX(${rp})`;
      ribbon.style.opacity    = String(Math.min(rp * 1.4, 1));
      ribbonC.style.opacity   = String(Math.min(rp * 1.4, 1));

      if (p < 1) {
        requestAnimationFrame(tick);
      } else {
        // Cinta se queda tenue
        ribbon.style.transition  = 'opacity 1s ease';
        ribbonC.style.transition = 'opacity 1s ease';
        ribbon.style.opacity  = '0.45';
        ribbonC.style.opacity = '0.45';
        halo.style.opacity = '0';
        resolve();
      }
    });
  });
}

/* ═══════════════════════════════════════════════════
   MOSTRAR GRUPO (fade in → hold → fade out rápido)
═══════════════════════════════════════════════════ */
async function showGroup(el, holdMs = 2600) {
  el.style.transition = 'opacity 0.55s ease, filter 0.55s ease';
  el.style.opacity = '1';
  el.style.filter  = 'blur(0)';
  await wait(holdMs);
  el.style.transition = 'opacity 0.18s ease';
  el.style.opacity = '0';
  await wait(200);
}

/* ═══════════════════════════════════════════════════
   RED NEURONAL
═══════════════════════════════════════════════════ */
let nodeData = []; // { el, x, y, vx, vy, tech }
let animFrameId = null;
const ctx = canvas.getContext('2d');

function buildNeuralNet() {
  const W = window.innerWidth;
  const H = window.innerHeight;
  canvas.width  = W;
  canvas.height = H;

  nodesDiv.innerHTML = '';
  nodeData = [];

  // Layout: 2x2 cajas con margenes y espacio superior para el título principal
  const topReserve = Math.max(120, H * 0.16);
  const margin = Math.min(W, H) * 0.03;
  const gap = margin;
  const boxW = (W - margin*2 - gap) / 2;
  const boxH = (H - topReserve - margin - gap) / 2;
  const layout = {
    frontend: { x: margin,                 y: topReserve },
    backend:  { x: margin + boxW + gap,    y: topReserve },
    data:     { x: margin,                 y: topReserve + boxH + gap },
    tools:    { x: margin + boxW + gap,    y: topReserve + boxH + gap },
  };
  const titles = { frontend:'Frontend', backend:'Backend & DB', data:'Data & BI', tools:'Herramientas' };

  const boxes = {};
  Object.entries(layout).forEach(([cat, p]) => {
    const box = document.createElement('div');
    box.className = 'cluster-box';
    box.style.left = p.x + 'px';
    box.style.top  = p.y + 'px';
    box.style.width  = boxW + 'px';
    box.style.height = boxH + 'px';
    box.style.borderColor = CAT_COLORS[cat].replace('0.55','0.18');
    const t = document.createElement('div');
    t.className = 'ctitle';
    t.style.color = CAT_COLORS[cat];
    t.textContent = titles[cat];
    const inner = document.createElement('div');
    inner.className = 'cinner';
    box.appendChild(t);
    box.appendChild(inner);
    nodesDiv.appendChild(box);
    boxes[cat] = { box, inner, x: p.x, y: p.y, w: boxW, h: boxH };
    requestAnimationFrame(() => { box.style.opacity = '1'; });
  });

  // Distribuir nodos dentro de cada inner box
  const groups = {};
  TECH.forEach(t => { (groups[t.cat] = groups[t.cat] || []).push(t); });

  Object.entries(groups).forEach(([cat, list]) => {
    const b = boxes[cat];
    // área útil del inner box
    const innerX = b.x + 8;
    const innerY = b.y + 38;
    const innerW = b.w - 16;
    const innerH = b.h - 46;
    // círculo de nodos centrado en la caja
    const cx = innerX + innerW/2;
    const cy = innerY + innerH/2;
    const r  = Math.min(innerW, innerH) * 0.32;
    list.forEach((tech, idx) => {
      const angle = (idx / list.length) * Math.PI * 2 - Math.PI/2;
      const radius = r * (0.78 + (idx % 2) * 0.22);
      const x = cx + Math.cos(angle) * radius;
      const y = cy + Math.sin(angle) * radius;

      const node = document.createElement('div');
      node.className = 'node';
      node.style.left = x + 'px';
      node.style.top  = y + 'px';
      node.style.opacity = '0';
      node.style.transition = 'opacity 0.6s ease';

      let icoHtml;
      if (tech.svg)      icoHtml = `<span class="ico" style="background:${tech.bg};color:${tech.fg}">${svgIco(tech.svg)}</span>`;
      else if (tech.ol)  icoHtml = `<span class="ico ol">${tech.ico}</span>`;
      else               icoHtml = `<span class="ico" style="background:${tech.bg};color:${tech.fg}">${tech.ico}</span>`;
      node.innerHTML = `${icoHtml}<span class="name">${tech.name}</span>`;
      nodesDiv.appendChild(node);

      // Suspendido: oscilación acotada al box
      const phase = Math.random() * Math.PI * 2;
      const ampY  = Math.min(14, innerH * 0.06);
      const ampX  = Math.min(8,  innerW * 0.03);
      const speed = 0.0006 + Math.random() * 0.0006;
      nodeData.push({
        el: node, bx: x, by: y, x, y,
        ampX, ampY, phase, speed,
        // límites de la caja para clamp
        minX: innerX + 50, maxX: innerX + innerW - 50,
        minY: innerY + 24, maxY: innerY + innerH - 24,
        tech,
      });
    });
  });
}

/* Relaciones reales dentro de cada grupo (por nombre) */
const RELATIONS = {
  // Frontend
  'JavaScript-TypeScript': true,
  'JavaScript-React': true,
  'JavaScript-Next.js': true,
  'TypeScript-React': true,
  'TypeScript-Next.js': true,
  'React-Next.js': true,
  'React-Tailwind': true,
  'Next.js-Tailwind': true,
  // Backend
  'Node.js-Express': true,
  'Node.js-MongoDB': true,
  'Node.js-PostgreSQL': true,
  'Express-MongoDB': true,
  'Express-PostgreSQL': true,
  'PostgreSQL-Supabase': true,
  'PostgreSQL-Prisma': true,
  'MongoDB-Prisma': true,
  'Supabase-Prisma': true,
  'Node.js-Prisma': true,
  // Data
  'Power BI-Pwr Query': true,
  'Power BI-DAX': true,
  'Pwr Query-ETL': true,
  'Power BI-ETL': true,
  'Pwr Query-DAX': true,
  // Tools
  'Git-GitHub': true,
  'Git-VSCode': true,
  'GitHub-VSCode': true,
};
function areRelated(a, b) {
  return !!(RELATIONS[`${a}-${b}`] || RELATIONS[`${b}-${a}`]);
}

function drawLines() {
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);
  for (let i = 0; i < nodeData.length; i++) {
    for (let j = i+1; j < nodeData.length; j++) {
      const a = nodeData[i], b = nodeData[j];
      if (a.tech.cat !== b.tech.cat) continue;
      if (!areRelated(a.tech.name, b.tech.name)) continue;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.strokeStyle = CAT_COLORS[a.tech.cat];
      ctx.lineWidth = 1.2;
      ctx.stroke();
    }
  }

  // Pulso viajante por líneas relacionadas
  const t = performance.now() * 0.001;
  nodeData.forEach((nd, i) => {
    const related = nodeData.filter((n,j) => j !== i && n.tech.cat === nd.tech.cat && areRelated(nd.tech.name, n.tech.name));
    if (related.length === 0) return;
    const target = related[Math.floor(t * 0.7 + i * 1.3) % related.length];
    const p = (t * 0.6 + i * 0.4) % 1;
    const px = nd.x + (target.x - nd.x) * p;
    const py = nd.y + (target.y - nd.y) * p;
    ctx.beginPath();
    ctx.arc(px, py, 2, 0, Math.PI*2);
    ctx.fillStyle = CAT_COLORS[nd.tech.cat].replace('0.55','0.9');
    ctx.fill();
  });
}

function updateNodes() {
  const t = performance.now();
  nodeData.forEach(nd => {
    let nx = nd.bx + Math.sin(t * nd.speed + nd.phase) * nd.ampX;
    let ny = nd.by + Math.cos(t * nd.speed * 1.3 + nd.phase) * nd.ampY;
    // clamp dentro de la caja
    nx = Math.max(nd.minX, Math.min(nd.maxX, nx));
    ny = Math.max(nd.minY, Math.min(nd.maxY, ny));
    nd.x = nx; nd.y = ny;
    nd.el.style.left = nx + 'px';
    nd.el.style.top  = ny + 'px';
  });
}

function neuralLoop() {
  updateNodes();
  drawLines();
  animFrameId = requestAnimationFrame(neuralLoop);
}

async function showNeuralNet() {
  buildNeuralNet();

  titleEl.style.top = '4%';
  titleEl.style.transform = 'translate(-50%, 0)';
  titleEl.style.transition = 'opacity 1.2s ease, filter 1.2s ease';
  titleEl.style.opacity = '1';
  titleEl.style.filter  = 'blur(0)';

  canvas.style.opacity = '1';
  nodesDiv.style.opacity = '1';

  nodeData.forEach((nd, i) => {
    setTimeout(() => { nd.el.style.opacity = '1'; }, i * 80);
  });

  ribbon.style.transition  = 'opacity 1.2s ease';
  ribbonC.style.transition = 'opacity 1.2s ease';
  ribbon.style.opacity  = '0';
  ribbonC.style.opacity = '0';

  neuralLoop();
}

/* ═══════════════════════════════════════════════════
   MAIN SEQUENCE
═══════════════════════════════════════════════════ */
async function main() {
  // 1. Katana aparece y atraviesa
  await animateKatana();
  await wait(300);

  // 2. Título "Stack principal"
  titleEl.style.opacity = '1';
  titleEl.style.filter  = 'blur(0)';
  await wait(2200);
  titleEl.style.transition = 'opacity 0.2s ease';
  titleEl.style.opacity = '0';
  await wait(250);

  // 3. Grupos secuenciales
  await showGroup(grpFront, 2600);
  await showGroup(grpBack,  2600);
  await showGroup(grpData,  2600);
  await showGroup(grpTools, 2800);
  await wait(200);

  // 4. Red neuronal
  await showNeuralNet();
}

main();

window.addEventListener('resize', () => {
  if (nodeData.length > 0) {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  }
});
</script>
