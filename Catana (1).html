<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Estocada — Catana (CSS)</title>
<style>
  :root {
    --bg-0: #07090c;
    --bg-1: #11151b;
    --ink: #e8e4dc;
    --accent: oklch(0.78 0.14 75);

    /* Katana proportions */
    --blade-len: 520px;
    --blade-thick: 7px;

    --guard-w: 10px;
    --guard-h: 28px;

    --grip-len: 130px;
    --grip-thick: 14px;

    --steel-1: #f4f1ea;
    --steel-2: #cfcabd;
    --steel-edge: #ffffff;
    --steel-shadow: #6b6a63;

    --grip-dark: #0e0f12;
    --grip-wrap: #1a1c20;
    --grip-stitch: #3a3d44;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(120% 80% at 50% 50%, var(--bg-1) 0%, var(--bg-0) 70%);
    color: var(--ink);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    display: grid;
    place-items: center;
    overflow: hidden;
  }
  body::before {
    content: "";
    position: fixed; inset: 0;
    background:
      radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.04), transparent 50%),
      radial-gradient(1px 1px at 70% 60%, rgba(255,255,255,0.03), transparent 50%),
      radial-gradient(1px 1px at 40% 80%, rgba(255,255,255,0.03), transparent 50%);
    pointer-events: none;
    mix-blend-mode: screen;
  }

  .stage {
    position: relative;
    width: min(96vw, 1600px);
    height: min(70vh, 720px);
    overflow: visible;
  }

  /* Faint horizontal guide that brightens during the reveal */
  .guide {
    position: absolute;
    left: 0; right: 0; top: 50%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(232,228,220,0.10) 20%, rgba(232,228,220,0.10) 80%, transparent);
    transform: translateY(-0.5px);
    opacity: 0;
    animation: guide 6s ease-in-out infinite;
  }
  @keyframes guide {
    0%, 12% { opacity: 0; }
    25%, 55% { opacity: 1; }
    65%, 100% { opacity: 0; }
  }

  /* Halo behind the blade during the reveal */
  .halo {
    position: absolute;
    top: 50%; left: 50%;
    width: 700px; height: 700px;
    margin-top: -350px; margin-left: -350px;
    border-radius: 50%;
    background: radial-gradient(closest-side, rgba(232,228,220,0.10), transparent 70%);
    filter: blur(6px);
    opacity: 0;
    animation: halo 6s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes halo {
    0%, 8%   { opacity: 0; transform: scale(0.9); }
    25%, 50% { opacity: 1; transform: scale(1); }
    62%      { opacity: 0.2; transform: scale(1.05); }
    66%, 100%{ opacity: 0; transform: scale(1.1); }
  }

  /* ───────── KATANA (100% CSS) ───────── */
  /* Wrapper holds the animation transforms; the inner .katana keeps the diagonal pose. */
  .katana-wrap {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 0;
    height: 0;
    will-change: transform, opacity, filter;
    animation: katana 6s cubic-bezier(.2,.7,.2,1) infinite;
  }

  .katana {
    position: relative;
    /* Diagonal pose like the original reference (handle low-left, tip up-right) */
    transform: rotate(-30deg);
    width: 0;
    height: 0;
  }

  /* ── Blade ── */
  .blade {
    position: absolute;
    left: 0;
    top: calc(var(--blade-thick) / -2);
    width: var(--blade-len);
    height: var(--blade-thick);
    border-radius: 1px 2px 2px 1px;
    background:
      /* shinogi (ridge) highlight */
      linear-gradient(180deg,
        var(--steel-2) 0%,
        var(--steel-1) 38%,
        var(--steel-edge) 50%,
        var(--steel-1) 62%,
        var(--steel-2) 100%);
    box-shadow:
      0 0 0 1px rgba(0,0,0,0.35) inset,
      0 0 8px rgba(255, 250, 220, 0.10);
  }
  /* Tip (kissaki) — slight angled point on the right */
  .blade::after {
    content: "";
    position: absolute;
    right: -10px;
    top: 0;
    width: 14px;
    height: 100%;
    background: linear-gradient(180deg, var(--steel-2), var(--steel-1) 50%, var(--steel-2));
    clip-path: polygon(0 0, 100% 50%, 0 100%);
  }
  /* Hamon — wavy temper line */
  .blade::before {
    content: "";
    position: absolute;
    left: 4px; right: 12px;
    top: 55%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.55) 8%, rgba(255,255,255,0.55) 92%, transparent);
    filter: blur(0.4px);
    opacity: 0.7;
  }

  /* ── Habaki (collar) ── */
  .habaki {
    position: absolute;
    left: -4px;
    top: -8px;
    width: 14px;
    height: 16px;
    background: linear-gradient(180deg, #d8d3c5, #f1ede2 50%, #b9b4a6);
    border-radius: 2px;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.4);
  }

  /* ── Tsuba (guard) ── */
  .tsuba {
    position: absolute;
    left: calc(-1 * var(--guard-w) - 4px);
    top: calc(var(--guard-h) / -2);
    width: var(--guard-w);
    height: var(--guard-h);
    background: linear-gradient(180deg, #1c1d20, #2a2b30 50%, #0f1013);
    border: 1px solid #000;
    border-radius: 2px;
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,0.05),
      0 0 0 1px rgba(0,0,0,0.6);
  }

  /* ── Tsuka (grip) ── */
  .grip {
    position: absolute;
    /* Sit just to the left of the tsuba, going further left */
    left: calc(-1 * var(--guard-w) - 4px - var(--grip-len));
    top: calc(var(--grip-thick) / -2);
    width: var(--grip-len);
    height: var(--grip-thick);
    background:
      /* diagonal wrap (tsuka-ito) — two crossing diagonal stripes for diamond look */
      repeating-linear-gradient( 45deg,
        transparent 0 8px,
        rgba(0,0,0,0.55) 8px 9px,
        transparent 9px 17px),
      repeating-linear-gradient(-45deg,
        transparent 0 8px,
        rgba(0,0,0,0.55) 8px 9px,
        transparent 9px 17px),
      linear-gradient(180deg, #2a2c31, #15171a 50%, #0a0b0d);
    border: 1px solid #000;
    border-radius: 3px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
  }
  /* Menuki — small ornament dot on the grip */
  .grip::after {
    content: "";
    position: absolute;
    left: 38%;
    top: 50%;
    width: 6px; height: 6px;
    margin: -3px 0 0 -3px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #c7a96a, #6e5320 70%, #2a1f08);
    box-shadow: 0 0 0 1px rgba(0,0,0,0.6);
  }
  /* Kashira — pommel cap on the far end */
  .kashira {
    position: absolute;
    left: calc(-1 * var(--guard-w) - 4px - var(--grip-len) - 8px);
    top: calc((var(--grip-thick) + 6px) / -2);
    width: 8px;
    height: calc(var(--grip-thick) + 6px);
    background: linear-gradient(180deg, #2a2b30, #0f1013);
    border: 1px solid #000;
    border-radius: 2px 1px 1px 2px;
  }

  /* Animation: reveal then strike */
  @keyframes katana {
    0%   { opacity: 0; transform: translate(-40px, 8px) scale(0.98); filter: blur(6px); }
    8%   { opacity: 0.45; filter: blur(3px); }
    18%  { opacity: 1; transform: translate(0, 0) scale(1); filter: blur(0); }
    35%  { transform: translate(0, -4px) scale(1); }
    50%  { transform: translate(0, 0) scale(1); opacity: 1; filter: blur(0); }
    /* wind-up */
    56%  { transform: translate(-90px, 0) scale(1); opacity: 1; filter: blur(0); }
    /* strike — fast across, level (rotate to horizontal so it reads like a thrust) */
    62%  { transform: translate(800px, 0) rotate(30deg) scale(1.02); opacity: 1; filter: blur(1px); }
    68%  { transform: translate(1500px, 0) rotate(30deg) scale(1.02); opacity: 0; filter: blur(2px); }
    100% { transform: translate(1500px, 0) rotate(30deg) scale(1.02); opacity: 0; }
  }

  /* Slash trail */
  .slash {
    position: absolute;
    top: 50%;
    left: -10%;
    width: 120%;
    height: 2px;
    transform: translateY(-1px) scaleX(0);
    transform-origin: left center;
    background: linear-gradient(90deg,
      transparent 0%,
      rgba(255, 248, 228, 0.0) 5%,
      rgba(255, 248, 228, 0.9) 45%,
      #ffffff 50%,
      rgba(255, 248, 228, 0.9) 55%,
      transparent 95%);
    box-shadow:
      0 0 12px rgba(255, 240, 200, 0.7),
      0 0 28px rgba(255, 220, 160, 0.45);
    opacity: 0;
    animation: slash 6s cubic-bezier(.2,.7,.2,1) infinite;
    pointer-events: none;
  }
  @keyframes slash {
    0%, 55%  { opacity: 0; transform: translateY(-1px) scaleX(0); }
    58%      { opacity: 0.6; transform: translateY(-1px) scaleX(0.05); }
    63%      { opacity: 1;   transform: translateY(-1px) scaleX(1); }
    70%      { opacity: 0.0; transform: translateY(-1px) scaleX(1); }
    100%     { opacity: 0;   transform: translateY(-1px) scaleX(1); }
  }
  .slash.core {
    height: 1px;
    background: linear-gradient(90deg, transparent, #fff 50%, transparent);
    box-shadow: 0 0 6px #fff, 0 0 18px rgba(255,255,255,0.6);
  }

  .caption {
    position: fixed;
    left: 0; right: 0; bottom: 28px;
    text-align: center;
    font-size: 11px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: rgba(232,228,220,0.55);
  }
  .caption b { color: var(--accent); font-weight: 500; letter-spacing: 0.32em; }

  .replay {
    position: fixed;
    top: 20px; right: 20px;
    background: transparent;
    color: rgba(232,228,220,0.7);
    border: 1px solid rgba(232,228,220,0.2);
    padding: 8px 14px;
    font: 11px/1 "Helvetica Neue", Helvetica, Arial, sans-serif;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 999px;
    transition: border-color .2s ease, color .2s ease, background .2s ease;
  }
  .replay:hover {
    color: #fff;
    border-color: rgba(232,228,220,0.45);
    background: rgba(232,228,220,0.04);
  }

  @media (prefers-reduced-motion: reduce) {
    .katana-wrap, .halo, .slash, .guide { animation-duration: 0s; opacity: 1; }
  }
</style>
</head>
<body>
  <button class="replay" id="replay" aria-label="Repetir">Repetir</button>

  <div class="stage" id="stage">
    <div class="guide"></div>
    <div class="halo"></div>

    <div class="katana-wrap" id="katana">
      <div class="katana">
        <div class="kashira"></div>
        <div class="grip"></div>
        <div class="tsuba"></div>
        <div class="habaki"></div>
        <div class="blade"></div>
      </div>
    </div>

    <div class="slash"></div>
    <div class="slash core"></div>
  </div>

  <div class="caption">居合 &nbsp;·&nbsp; <b>iaijutsu</b> &nbsp;·&nbsp; el corte de un solo movimiento</div>

  <script>
    const stage = document.getElementById('stage');
    document.getElementById('replay').addEventListener('click', () => {
      stage.querySelectorAll('.katana-wrap, .halo, .slash, .guide').forEach(el => {
        el.style.animation = 'none';
        // force reflow
        el.offsetHeight;
        el.style.animation = '';
      });
    });
  </script>
</body>
</html>
